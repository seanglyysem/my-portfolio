<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.classList.add(theme);
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"
      content="Seangly — Full Stack Developer. Portfolio showcasing projects, skills, and learning journey."
    />
    <!-- Open Graph / Social Sharing -->

    <meta property="og:title" content="Seangly | Portfolio" />
    <meta property="og:description" content="Full Stack Developer building web apps with React, Node.js, and modern technologies." />
    <meta property="og:url" content="https://seanglysem.vercel.app" />
    <!-- Twitter Card -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />
